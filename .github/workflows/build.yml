name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify app
        run: ./scripts/build.sh
      - name: Existing offline regression tests
        run: |
          ./scripts/test-audio-input-policy.sh
          ./scripts/test-legacy-parity.sh
          ./scripts/test-text-pipeline.sh
          ./scripts/test-transcription-client.sh
          swiftc -swift-version 5 Sources/GroqVoiceInput/RemoteMessages.swift Sources/GroqVoiceInput/RemoteTargetValidationPolicy.swift Tests/RemoteProtocolTests.swift -o build/RemoteProtocolTests
          ./build/RemoteProtocolTests
      - name: Cat configuration, lifecycle, and native AppKit renders
        run: ./scripts/test-cat.sh
      - name: Upload native macOS cat captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-cat-native-renders
          path: build/cat-render/
          if-no-files-found: warn
