name: Release macOS
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Resources/Info.plist', 'RELEASE_NOTES.md', '.github/workflows/release-macos.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag on main, for example v1.3.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yuipan0611/groq-ai-voice-input-macos' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 60
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source version and immutable release ref
        id: prepare
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            REQUESTED_TAG="v$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            python3 scripts/release_metadata.py "$REQUESTED_TAG" 1 >/dev/null
            git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}"
            git merge-base --is-ancestor "refs/tags/$REQUESTED_TAG" origin/main
            git checkout --detach "refs/tags/$REQUESTED_TAG"
          fi
          python3 scripts/release_metadata.py --from-plist Resources/Info.plist "$REQUESTED_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo 'verify=true' >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/published-tags.txt"
          if grep -Fxq -- "$REQUESTED_TAG" "$RUNNER_TEMP/published-tags.txt"; then
            git merge-base --is-ancestor "refs/tags/$REQUESTED_TAG" origin/main
            echo "RELEASE_COMMIT=$(git rev-parse "refs/tags/$REQUESTED_TAG^{commit}")" >> "$GITHUB_ENV"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "$REQUESTED_TAG is already published; verify its immutable assets without replacing them. Increase both source version and build for the next update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/release_metadata.py --check-progression "$REQUESTED_TAG" "$RUNNER_TEMP/published-tags.txt"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Reject reused or decreasing build numbers
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/published-tags.txt" ]]; then
            LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            gh release download "$LATEST_TAG" --pattern appcast.xml --dir "$RUNNER_TEMP/previous-feed"
            python3 scripts/release_metadata.py --check-build "$RELEASE_BUILD" "$RUNNER_TEMP/previous-feed/appcast.xml"
          fi
      - name: Prepare pinned updater dependency
        if: steps.prepare.outputs.publish == 'true'
        run: ./scripts/fetch-sparkle.sh
      - name: Offline regression tests
        if: steps.prepare.outputs.publish == 'true'
        run: ./scripts/test-all.sh
      - name: Sign and package free release
        if: steps.prepare.outputs.publish == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/release-macos.sh
      - name: Publish complete release
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Version commits on main publish in this run. A tag created with
          # GITHUB_TOKEN does not need to trigger another workflow.
          if git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_COMMIT" ]]
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_COMMIT" >/dev/null
          fi
          # Never replace a published release; failed uploads remain a draft.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG (build $RELEASE_BUILD)" --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" \
            dist/update/*.zip dist/update/appcast.xml dist/update/SHA256SUMS.txt \
            dist/Groq-AI-Voice-Input-macOS-*.zip dist/Groq-AI-Voice-Input-macOS-*.sha256 CHANGELOG.md
          if ! gh release edit "$RELEASE_TAG" --draft=false --latest; then
            # GitHub can accept the PATCH but time out before returning it.
            # Reconcile the server state; do not publish another copy.
            [[ "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" == true ]] || exit 1
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$RELEASE_TAG" ]] || exit 1
          fi
      - name: Verify published update assets
        if: steps.prepare.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SIGNING_SHA1: ${{ vars.MACOS_SIGNING_SHA1 }}
        run: |
          set -euo pipefail
          PUBLISHED="$RUNNER_TEMP/published-release"
          for attempt in 1 2 3; do
            if gh release download "$RELEASE_TAG" --pattern '*.zip' --pattern '*.sha256' --pattern appcast.xml --pattern SHA256SUMS.txt --dir "$PUBLISHED" --clobber; then break; fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep 5
          done
          (cd "$PUBLISHED" && shasum -a 256 -c SHA256SUMS.txt && shasum -a 256 -c ./*.sha256)
          ditto -x -k "$PUBLISHED/Neighbor-macOS-$RELEASE_VERSION.zip" "$PUBLISHED/extracted"
          APP="$PUBLISHED/extracted/AI語音輸入.app"
          python3 scripts/validate-signing.py "$APP" "$EXPECTED_SIGNING_SHA1"
          python3 scripts/validate-release.py "$APP" "$PUBLISHED/appcast.xml" "$PUBLISHED/Neighbor-macOS-$RELEASE_VERSION.zip"
          python3 - "$APP/Contents/Info.plist" Resources/Info.plist <<'PY'
          import plistlib, sys
          from pathlib import Path
          published, source = (plistlib.loads(Path(path).read_bytes()) for path in sys.argv[1:])
          for key in ('CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion', 'SUPublicEDKey'):
              assert published[key] == source[key], key
          PY
          {
            echo "Published version: $RELEASE_VERSION (build $RELEASE_BUILD)"
            echo "Commit: $RELEASE_COMMIT"
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "Update feed: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
            echo 'The app checks automatically; installation remains the user’s choice.'
          } >> "$GITHUB_STEP_SUMMARY"
