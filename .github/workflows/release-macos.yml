name: Release macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag on main, for example v1.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yuipan0611/groq-ai-voice-input-macos' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 60
    environment: macos-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release ref
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_metadata.py "$REQUESTED_TAG" "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/published-tags.txt"
          python3 scripts/release_metadata.py --check-progression "$REQUESTED_TAG" "$RUNNER_TEMP/published-tags.txt"
          git rev-parse --verify "refs/tags/$REQUESTED_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$REQUESTED_TAG" origin/main
          git checkout --detach "refs/tags/$REQUESTED_TAG"
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - name: Prepare pinned updater dependency
        run: ./scripts/fetch-sparkle.sh
      - name: Offline regression tests
        run: ./scripts/test-all.sh
      - name: Sign, notarize and package
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/release-macos.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail if this version already exists; never replace published binaries.
          # A failed upload leaves a draft, so latest/appcast.xml stays unchanged.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" \
            dist/update/*.zip dist/update/appcast.xml dist/update/SHA256SUMS.txt \
            dist/Groq-AI-Voice-Input-macOS-*.zip dist/Groq-AI-Voice-Input-macOS-*.sha256
          gh release edit "$RELEASE_TAG" --draft=false --latest
