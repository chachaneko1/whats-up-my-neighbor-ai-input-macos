<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>會議逐字稿核對</title>
<style>body{font:16px system-ui;max-width:1100px;margin:32px auto;padding:0 20px;color:#182534;background:#f4f6fa}h1{font-size:26px}section,article{background:white;padding:18px;margin:14px 0;border-radius:12px}label{display:inline-block;margin:8px}input,textarea,select,button{font:inherit;padding:8px;border:1px solid #aeb9c5;border-radius:5px}button{cursor:pointer;background:#edf4ff}textarea{display:block;width:96%;min-height:52px;margin-top:10px}.review{border-left:5px solid #b65b08}small{color:#536574}audio{width:100%}</style>
<h1>會議逐字稿核對</h1><p>自動辨識草稿。A、B 只代表本次錄音的匿名人物；請聽原音再填姓名。修改只留在此頁，離開前請下載保存。</p>
<section><label>載入原錄音供核對 <input id="audioFile" type="file" accept="audio/*"></label><audio id="audio" controls></audio><small>音檔只在瀏覽器本機讀取，不上傳。</small></section>
<section><h2>說話者姓名</h2><div id="names"></div><button id="json">下載修改後 JSON</button> <button id="md">下載 Markdown</button> <button id="reset">重設姓名</button><p id="status" role="status"></p></section><div id="rows"></div>
<script id="data" type="application/json">__DOCUMENT__</script><script>
'use strict';
const doc=JSON.parse(document.getElementById('data').textContent), names=document.getElementById('names'), rows=document.getElementById('rows'), audio=document.getElementById('audio');
const ids=[...new Set(doc.segments.map(r=>r.speaker).filter(x=>x!=='UNKNOWN'))];
doc.speaker_names=doc.speaker_names||{};
const el=(tag,text)=>{let x=document.createElement(tag);if(text!==undefined)x.textContent=text;return x};
const stamp=n=>{let ms=Math.round(n*1000);return `${String(Math.floor(ms/3600000)).padStart(2,'0')}:${String(Math.floor(ms/60000)%60).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(ms%1000).padStart(3,'0')}`};
function renderNames(){names.replaceChildren();for(const id of ids){const label=el('label',id+' → '),input=el('input');input.value=doc.speaker_names[id]||'';input.placeholder='手動填姓名';input.maxLength=80;input.addEventListener('input',()=>{doc.speaker_names[id]=input.value;renderRows()});label.append(input);names.append(label)}}
function renderRows(){rows.replaceChildren();for(const row of doc.segments){const a=el('article');if(row.needs_review)a.className='review';const seek=el('button',stamp(row.start)+'–'+stamp(row.end));seek.onclick=()=>{if(!audio.src){document.getElementById('status').textContent='請先載入原錄音。';return}audio.currentTime=row.start;audio.play().catch(()=>{})};a.append(seek,el('span',' '+(doc.speaker_names[row.speaker]||row.speaker)+' '));const speaker=el('select');speaker.setAttribute('aria-label','片段說話者');for(const id of [...ids,'UNKNOWN']){const option=el('option',doc.speaker_names[id]||id);option.value=id;speaker.append(option)}speaker.value=row.speaker;speaker.onchange=()=>{row.speaker=speaker.value;row.manually_reviewed=true;row.needs_review=row.speaker==='UNKNOWN';renderRows()};a.append(speaker,el('small',row.needs_review?' 需確認（人物不確定或邊界混合）':''));const text=el('textarea');text.value=row.text;text.setAttribute('aria-label','片段文字');text.oninput=()=>{row.text=text.value;row.manually_edited=true};a.append(text);rows.append(a)}}
let audioURL;document.getElementById('audioFile').onchange=e=>{if(audioURL)URL.revokeObjectURL(audioURL);if(e.target.files[0]){audioURL=URL.createObjectURL(e.target.files[0]);audio.src=audioURL}};
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),link=el('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已產生下載檔案，請確認瀏覽器已保存。'}
document.getElementById('json').onclick=()=>download('transcript-reviewed.json',JSON.stringify({...doc,review_status:'human_edits_exported'},null,2),'application/json');
document.getElementById('md').onclick=()=>download('transcript-reviewed.md','# 會議逐字稿\n\n'+doc.segments.map(r=>`[${stamp(r.start)}–${stamp(r.end)}] ${(doc.speaker_names[r.speaker]||r.speaker).replace(/[\r\n]/g,' ')}: ${r.text.replace(/[\r\n]/g,' ')}${r.needs_review?' 【需確認】':''}`).join('\n'),'text/markdown;charset=utf-8');
document.getElementById('reset').onclick=()=>{doc.speaker_names={};renderNames();renderRows()};renderNames();renderRows();
</script></html>
