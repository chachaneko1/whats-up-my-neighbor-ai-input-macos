<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5f6;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#292629}#screen{width:100%;height:100%}#login{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}#login[hidden]{display:none}input{border:1px solid #dfd7da;border-radius:7px;padding:9px 11px;width:200px;font-size:13px}button:disabled{opacity:.4;cursor:default}button{background:#242125;border:0;border-radius:7px;color:white;padding:8px 18px;font-size:12px}#message{position:absolute;bottom:8px;left:8px;right:8px;text-align:center;color:#777;background:#fffdfd;padding:6px;border-radius:6px;font-size:11px}#message:empty{display:none}
</style></head><body><div id="screen"></div><form id="login" hidden><input id="username" autocomplete="off" placeholder="使用者名稱" hidden><input id="password" type="password" autocomplete="off" placeholder="VNC 密碼" aria-label="VNC 密碼" required><button id="submit" disabled>登入</button></form><div id="message">正在與 VPS 桌面連線…</div><script type="module" src="client.js"></script></body></html>
